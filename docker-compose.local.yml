name: deployfox-local
x-backend: &backend
  build:
    context: ./backend
    target: runtime
  environment: &backend-env
    DATABASE_URL: postgres://deployfox@postgres:5432/deployfox?sslmode=disable
    REDIS_URL: redis://redis:6379/0
    APP_ENV: development
    DEPLOYMENT_PROVIDER: mock
    PUBLIC_URL: http://localhost:3000
  volumes:
    - local_secrets:/run/deployfox:ro
  networks: [control]
  restart: unless-stopped
  stop_grace_period: 40s
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  depends_on:
    init:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  logging: &logging
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
services:
  init:
    image: alpine:3.22
    entrypoint: [sh, /init.sh]
    volumes:
      - ./infrastructure/scripts/local-init.sh:/init.sh:ro
      - local_secrets:/runtime
    network_mode: none
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: deployfox
      POSTGRES_DB: deployfox
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [control]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U deployfox -d deployfox]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    logging: *logging
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes", --maxmemory, 128mb, --maxmemory-policy, noeviction]
    volumes: [redis_data:/data]
    networks: [control]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    logging: *logging
  api:
    <<: *backend
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 5s
      timeout: 3s
      retries: 30
  worker:
    <<: *backend
    command: [worker]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, kill -0 1]
      interval: 15s
      timeout: 3s
      retries: 3
  frontend:
    build: ./frontend
    environment:
      API_INTERNAL_URL: http://api:8080
    ports: ["127.0.0.1:3000:3000"]
    networks: [control]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:3000/]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    logging: *logging
networks:
  control: {}
volumes:
  postgres_data: {}
  redis_data: {}
  local_secrets: {}
